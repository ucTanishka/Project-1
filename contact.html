<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131d">
  <meta name="description" content="Get in touch. We'd love to hear from you.">
  <title>Contact · Hello, world</title>
  <style>
    :root{color-scheme:dark;--ink:#f6f3ff;--muted:#b8b5ce;--mint:#9ef0d0}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:7rem 1.5rem 2rem;display:grid;place-items:center;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 16% 18%,rgba(124,91,220,.24),transparent 35%),radial-gradient(ellipse at 83% 80%,rgba(49,190,158,.13),transparent 34%),#11131d}.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff 98%,transparent),radial-gradient(1px 1px at 70% 20%,#c8b7ff 98%,transparent),radial-gradient(1.5px 1.5px at 85% 63%,#fff 98%,transparent),radial-gradient(1px 1px at 38% 78%,#a8ffe1 98%,transparent);background-size:340px 310px;opacity:.4}.site-nav{position:fixed;z-index:2;top:1.5rem;right:clamp(1.25rem,5vw,3.5rem);display:flex;gap:.4rem;padding:.4rem;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(17,19,29,.68);backdrop-filter:blur(12px)}.site-nav a{padding:.65rem .9rem;border-radius:999px;color:#d7d3e5;text-decoration:none;font-size:.84rem;transition:background .2s,color .2s}.site-nav a:hover,.site-nav a:focus-visible{color:#fff;background:rgba(196,168,255,.17);outline:none}main{position:relative;width:min(100%,760px);padding:clamp(2.5rem,8vw,5rem);border:1px solid rgba(255,255,255,.13);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));box-shadow:0 30px 100px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(16px);animation:arrive .8s ease both}.eyebrow{margin:0 0 1.2rem;color:var(--mint);font-size:.74rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(3rem,9vw,6rem);letter-spacing:-.07em;line-height:1;background:linear-gradient(105deg,#fff 8%,#d8c8ff 52%,#9ef0d0);color:transparent;background-clip:text;-webkit-background-clip:text}.copy{max-width:590px;margin:1.6rem 0 0;color:var(--muted);font-size:1.08rem;line-height:1.8}.contact-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.25rem;margin-top:2rem;padding:1.4rem 1.5rem;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.04)}.contact-label{display:block;margin-bottom:.4rem;color:#8d8aa4;font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.contact-card a{color:#d5c6ff;font-size:clamp(1rem,3vw,1.25rem);text-decoration:none}.contact-card a:hover{text-decoration:underline}.arrow{color:var(--mint);font-size:1.4rem}.footer{margin-top:2rem;color:#88869e;font-size:.85rem}.footer a{color:#cdbbff;text-decoration:none}.footer a:hover{text-decoration:underline}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">The conversation starts here</p>
    <h1>Say hello.</h1>
    <p class="copy">Have a thought, a question, or just want to share what you’re making? We’d love to hear from you. Drop us a note and let’s start a conversation.</p>
    <div class="contact-card"><div><span class="contact-label">Send a little note</span><a href="mailto:hello@example.com">hello@example.com</a></div><span class="arrow" aria-hidden="true">↗</span></div>
    <p class="footer">Want to know more first? <a href="about.html">Visit the about page →</a></p>
  </main>
</body>
</html>
