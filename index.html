<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131d">
  <meta name="description" content="A little hello, made with care.">
  <title>Hello, world ✨</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f3ff;
      --muted: #b8b5ce;
      --accent: #c4a8ff;
      --mint: #9ef0d0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 16% 18%, rgba(124, 91, 220, .24), transparent 35%),
        radial-gradient(ellipse at 83% 80%, rgba(49, 190, 158, .13), transparent 34%),
        #11131d;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image: radial-gradient(1px 1px at 20% 30%, #fff 98%, transparent),
                        radial-gradient(1px 1px at 70% 20%, #c8b7ff 98%, transparent),
                        radial-gradient(1.5px 1.5px at 85% 63%, #fff 98%, transparent),
                        radial-gradient(1px 1px at 38% 78%, #a8ffe1 98%, transparent),
                        radial-gradient(1px 1px at 57% 48%, #fff 98%, transparent);
      background-size: 340px 310px;
      opacity: .46;
    }
    .stars::before { transform: translate(120px, 80px); opacity: .45; }
    .stars::after { transform: translate(-80px, 170px); opacity: .35; }

    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(2.5rem, 8vw, 5.75rem) clamp(1.5rem, 8vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
      box-shadow: 0 30px 100px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin: 0 0 1.8rem;
      color: var(--mint);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      width: 22px;
      height: 1px;
      background: currentColor;
      opacity: .55;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 11vw, 7.2rem);
      font-weight: 750;
      letter-spacing: -.075em;
      line-height: .98;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(105deg, #fff 8%, #d8c8ff 47%, #9ef0d0 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .sparkle {
      display: inline-block;
      margin-left: .08em;
      color: #ffe39d;
      font-size: .52em;
      vertical-align: top;
      transform: translateY(.05em);
      filter: drop-shadow(0 0 14px rgba(255, 227, 157, .5));
      animation: twinkle 3s ease-in-out infinite;
    }

    .message {
      max-width: 440px;
      margin: 1.7rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.75;
    }

    .signature {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2.4rem;
      padding: .72rem 1rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #e2ddf3;
      background: rgba(255,255,255,.045);
      font-size: .83rem;
      letter-spacing: .02em;
    }
    .signature i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px rgba(158,240,208,.8);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes twinkle {
      0%, 100% { transform: translateY(.05em) rotate(0) scale(1); opacity: 1; }
      50% { transform: translateY(.05em) rotate(12deg) scale(1.13); opacity: .8; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">A fresh beginning</p>
    <h1>Hello,<span>world<span class="sparkle" aria-hidden="true">✦</span></span></h1>
    <p class="message">A small page, a big hello. Here’s to the ideas, adventures, and happy little discoveries just around the corner.</p>
    <div class="signature"><i aria-hidden="true"></i> Made with a little extra sparkle</div>
  </main>
</body>
</html>
